<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fake Comment Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f5f5f5;
    }
    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
      background: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
    }
    input, textarea, select {
      width: 100%;
      padding: 8px;
    }
    .preview {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #ccc;
      background: #fafafa;
      position: relative;
    }
    .comment-box {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .comment-box img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
    }
    .comment-content {
      flex: 1;
      background: #f0f2f5;
      padding: 8px 12px;
      border-radius: 18px;
      position: relative;
    }
    .comment-content p {
      margin: 5px 0 0;
      font-size: 14px;
      word-wrap: break-word;
    }
    .name-block {
      font-weight: bold;
      margin-bottom: 3px;
    }
    .name-block span {
      color: #1877f2;
      font-size: 12px;
      font-weight: normal;
      margin-left: 4px;
    }
    .meta-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 5px;
      flex-wrap: nowrap;
    }
    .meta-left {
      font-size: 12px;
      color: gray;
      flex-shrink: 0;
    }
    .meta-right {
      display: flex;
      align-items: center;
      font-size: 12px;
      color: gray;
      gap: 4px;
      flex-shrink: 0;
      margin-left: auto;
    }
    .meta-right img {
      width: 18px;
      height: 18px;
      object-fit: contain;
    }
    .download-btn {
      display: block;
      margin: 20px auto 0;
      padding: 10px 20px;
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Fake Comment Generator</h2>
    <div class="form-group">
      <label for="platform">Select Platform</label>
      <select id="platform">
        <option value="facebook">Facebook</option>
        <option value="tiktok">TikTok</option>
        <option value="twitter">Twitter</option>
        <option value="linkedin">LinkedIn</option>
      </select>
    </div>
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name">
    </div>
    <div class="form-group">
      <label for="comment">Comment</label>
      <textarea id="comment" rows="3"></textarea>
    </div>
    <div class="form-group">
      <label for="days">Time Ago</label>
      <input type="text" id="days" placeholder="e.g. 12m">
    </div>
    <div class="form-group">
      <label for="reactions">Number of Reactions</label>
      <input type="number" id="reactions" placeholder="e.g. 2">
    </div>
    <div class="form-group">
      <label for="image">Profile Image</label>
      <input type="file" id="image" accept="image/*">
    </div>
    <div id="preview" class="preview">
      <div class="comment-box">
        <img id="previewImg" src="img/4086679.png" alt="">
        <div style="width:100%">
          <div class="comment-content">
            <div class="name-block" id="previewName">Name <span>· Follow</span></div>
            <p id="previewText">This is a sample comment</p>
          </div>
          <div class="meta-wrapper">
            <div class="meta-left">
              <span id="previewDays">12m</span> &nbsp; Like &nbsp; Reply
            </div>
            <div class="meta-right">
              <span id="previewReact">2</span>
              <img src="img/like.png" alt="like">
              <img src="img/love.png" alt="love">
              <img src="img/care.png" alt="care">
            </div>
          </div>
        </div>
      </div>
    </div>
    <button class="download-btn" onclick="downloadComment()">Download Comment</button>
  </div>

  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <script>
    document.getElementById("name").addEventListener("input", (e) => {
      document.getElementById("previewName").innerHTML = e.target.value + ' <span>· Follow</span>';
    });

    document.getElementById("comment").addEventListener("input", (e) => {
      document.getElementById("previewText").textContent = e.target.value;
    });

    document.getElementById("days").addEventListener("input", (e) => {
      document.getElementById("previewDays").textContent = e.target.value;
    });

    document.getElementById("reactions").addEventListener("input", (e) => {
      document.getElementById("previewReact").textContent = e.target.value;
    });

    document.getElementById("image").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById("previewImg").src = e.target.result;
        }
        reader.readAsDataURL(file);
      }
    });

    function downloadComment() {
      html2canvas(document.querySelector("#preview")).then(canvas => {
        const link = document.createElement("a");
        link.download = 'comment.png';
        link.href = canvas.toDataURL("image/png");
        link.click();
      });
    }
  </script>
</body>
</html>
